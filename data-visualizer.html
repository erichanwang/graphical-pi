<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Streams real digits of pi and plots a live, glowing histogram of digit frequency, rendered at full device resolution.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ctext x='50' y='68' font-size='64' text-anchor='middle' fill='%2310b981' font-family='monospace'%3E%CF%80%3C/text%3E%3C/svg%3E">
    <title>Pi Digits Visualizer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #000; color: #fff; overflow: hidden; }
        #bottom-controls {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.98), rgba(0,0,0,0.3)); padding: 12px;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center; font-size: 13px; backdrop-filter: blur(20px);
        }
        .slider-group { display: flex; flex-direction: column; min-width: 130px; }
        label { margin: 0 0 3px 0; font-size: 11px; opacity: 0.9; }
        input[type="range"] { width: 100px; height: 5px; background: #222; border-radius: 3px; accent-color: #10b981; }
        button { padding: 8px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; color: white; font-weight: 500; transition: all 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        #fetch-btn { background: linear-gradient(135deg, #3b82f6, #1e40af); }
        #fetch-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        #load-more-btn { background: linear-gradient(135deg, #22c55e, #15803d); }
        #load-more-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.4); }
        #status { font-size: 12px; min-width: 200px; text-align: center; flex-shrink: 0; opacity: 0.9; font-family: 'SF Mono', monospace; }
        #current-digit {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 9;
            font-size: clamp(140px, 25vw, 320px); font-weight: 900; letter-spacing: -0.02em;
            text-shadow: 0 0 80px currentColor; opacity: 0.97; pointer-events: none; transition: all 0.08s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        }
        canvas { display: block; touch-action: none; }
        .nav-link {
            position: fixed; top: 12px; right: 12px; z-index: 10;
            color: #fff; text-decoration: none; font-size: 13px; padding: 9px 14px;
            background: rgba(15, 15, 20, 0.55); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; backdrop-filter: blur(14px);
        }
        .nav-link:hover { background: rgba(255,255,255,0.18); }
        .nav-link:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid #10b981; outline-offset: 2px;
        }
    </style>
</head>
<body>
    <a class="nav-link" href="index.html">&larr; Graphical Pi</a>
    <div id="bottom-controls">
        <div class="slider-group">
            <label>π Count: <span id="digit-count-val">50K</span></label>
            <input type="range" id="digit-count" min="1000" max="1000000" step="1000" value="50000">
        </div>
        <div class="slider-group">
            <label>Tick delay: <span id="speed-val">0.2</span>ms</label>
            <input type="range" id="speed" min="-1.5" max="2.5" step="0.05" value="-0.7">
        </div>
        <button id="fetch-btn">🚀 Load 50K π</button>
        <button id="load-more-btn">+50K</button>
        <div id="status" role="status">Ready - logarithmic hyperspeed animation</div>
    </div>
    <canvas id="chart-canvas"></canvas>
    <div id="current-digit">π</div>

    <script>
        const canvas = document.getElementById('chart-canvas');
        const ctx = canvas.getContext('2d');
        const countSlider = document.getElementById('digit-count');
        const speedSlider = document.getElementById('speed');
        const fetchBtn = document.getElementById('fetch-btn');
        const moreBtn = document.getElementById('load-more-btn');
        const status = document.getElementById('status');
        const countVal = document.getElementById('digit-count-val');
        const speedVal = document.getElementById('speed-val');
        const digitEl = document.getElementById('current-digit');

        let f = new Array(10).fill(0);
        let p = 0;
        let d = '';
        let raf = 0;
        let loading = false;

        let dpr = window.devicePixelRatio || 1;
        let w = window.innerWidth;
        let h = window.innerHeight;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            // setTransform, not scale, so repeated resizes never compound the scale factor.
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        function formatCount(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
            if (n >= 1000) return Math.round(n / 1000) + 'K';
            return String(n);
        }

        function updateFetchLabel() {
            fetchBtn.textContent = `🚀 Load ${formatCount(parseInt(countSlider.value))} π`;
        }

        // Log speed (negative = sub-ms ultra)
        function spd() {
            return Math.max(0.05, Math.pow(10, parseFloat(speedSlider.value)));
        }

        countSlider.oninput = () => {
            countVal.textContent = parseInt(countSlider.value).toLocaleString();
            updateFetchLabel();
        };
        speedSlider.oninput = () => speedVal.textContent = spd().toFixed(1);
        updateFetchLabel();

        async function π(n) {
            try {
                const r = await fetch(`https://api.pi.delivery/api/v1/pi?decimal_places=${n}`);
                if (!r.ok) throw new Error('bad response');
                const data = await r.json();
                return data.pi.replace(/[^0-9]/g, '').slice(1);
            } catch {
                const s = '14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196442881097566593344612847564823378678316527120190914564856692346034861045432664821339360726024914127372458700660631558817488152092096282925409171536436789259036001133053054882046652138414695194151160943305727036575959195309218611738193261179310511854807446237';
                return s.repeat(Math.ceil(n / s.length)).slice(0, n);
            }
        }

        function tick() {
            if (p >= d.length) {
                cancelAnimationFrame(raf);
                status.textContent = `Complete! ${p.toLocaleString()} π digits`;
                return;
            }
            const c = d[p];
            f[parseInt(c)]++;
            p++;
            digitEl.textContent = c;
            digitEl.style.color = `hsl(${parseInt(c)*36}, 95%, 65%)`;
        }

        function paint() {
            ctx.clearRect(0, 0, w, h);

            const bw = Math.floor((w - 80) / 10);
            const ch = h * 0.78;
            const mb = 115;
            const mf = Math.max(...f, 1);

            // Smooth gradient BG
            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#000');
            g.addColorStop(0.6, '#0a0a0a');
            g.addColorStop(1, '#1a1a1a');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);

            // Grid lines
            ctx.strokeStyle = 'rgba(64,128,255,0.15)';
            ctx.lineWidth = 1.2;
            for (let i = 0; i <= 10; i += 2) {
                const y = h - mb - (i/10) * ch;
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(w - 40, y);
                ctx.stroke();
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Bars with advanced glow
            for (let i = 0; i < 10; i++) {
                const bh = f[i] / mf * ch;
                const x = 45 + i * bw;

                // Multi-layer glow
                ctx.shadowColor = `hsl(${i*36}, 95%, 60%)`;
                ctx.shadowBlur = 25;
                ctx.fillStyle = `hsla(${i*36}, 95%, 60%, 0.8)`;
                ctx.fillRect(x-1, h - mb - bh -1, bw+2, bh+2);
                ctx.shadowBlur = 12;
                ctx.fillStyle = `hsla(${i*36}, 95%, 65%, 1)`;
                ctx.fillRect(x, h - mb - bh, bw-2, bh);
                ctx.shadowBlur = 0;

                // Digit label HIGH above (safe position)
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.font = `bold ${Math.min(30, w/40)}px system-ui`;
                ctx.fillText(i, x + bw/2, h - mb - bh - 35); // Higher up
                ctx.shadowBlur = 0;

                // Count center
                ctx.font = `bold ${Math.min(22, w/55)}px monospace`;
                ctx.fillStyle = '#f0f0f0';
                ctx.fillText(f[i].toLocaleString(), x + bw/2, h - mb - bh/2 + 2);

                if (p > 100) {
                    ctx.font = `${Math.min(15, w/85)}px monospace`;
                    ctx.fillStyle = '#888';
                    ctx.fillText(((f[i]/p)*100).toFixed(1)+'%', x + bw/2, h - mb + 8);
                }
            }

            // Dynamic title
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#10b981';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = `bold ${Math.min(52, w/20)}px system-ui`;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`π | ${p.toLocaleString()} digits`, 30, 40);
            ctx.shadowBlur = 0;
        }

        let fpsCounter = 0;
        function loop() {
            fpsCounter++;
            if (fpsCounter % Math.max(1, Math.floor(spd())) === 0) tick();
            paint();
            raf = requestAnimationFrame(loop);
        }

        fetchBtn.onclick = async () => {
            if (loading) return;
            loading = true;
            fetchBtn.disabled = true;
            moreBtn.disabled = true;
            status.textContent = 'Loading π digits...';
            try {
                d = await π(parseInt(countSlider.value));
                f.fill(0);
                p = 0;
                cancelAnimationFrame(raf);
                status.textContent = `⚡ Loaded ${d.length.toLocaleString()} - maximum speed`;
                requestAnimationFrame(loop);
            } finally {
                loading = false;
                fetchBtn.disabled = false;
                moreBtn.disabled = false;
            }
        };

        moreBtn.onclick = async () => {
            if (loading) return;
            loading = true;
            fetchBtn.disabled = true;
            moreBtn.disabled = true;
            status.textContent = 'Streaming more π...';
            try {
                d += await π(50000);
                status.textContent = `+50K | ${d.length.toLocaleString()} total`;
                if (!raf) requestAnimationFrame(loop);
            } finally {
                loading = false;
                fetchBtn.disabled = false;
                moreBtn.disabled = false;
            }
        };

        paint();
    </script>
</body>
</html>
