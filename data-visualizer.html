<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Digits Visualizer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #000; color: #fff; overflow: hidden; }
        #bottom-controls {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.98), rgba(0,0,0,0.3)); padding: 12px;
            display: flex; gap: 15px; align-items: center; font-size: 13px; backdrop-filter: blur(20px);
        }
        .slider-group { display: flex; flex-direction: column; min-width: 130px; }
        label { margin: 0 0 3px 0; font-size: 11px; opacity: 0.9; }
        input[type="range"] { width: 100px; height: 5px; background: #222; border-radius: 3px; accent-color: #10b981; }
        button { padding: 8px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; color: white; font-weight: 500; transition: all 0.2s; }
        #fetch-btn { background: linear-gradient(135deg, #3b82f6, #1e40af); }
        #fetch-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        #load-more-btn { background: linear-gradient(135deg, #22c55e, #15803d); }
        #load-more-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.4); }
        #status { font-size: 12px; min-width: 200px; text-align: center; flex-shrink: 0; opacity: 0.9; font-family: 'SF Mono', monospace; }
        #current-digit {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 9;
            font-size: clamp(140px, 25vw, 320px); font-weight: 900; letter-spacing: -0.02em;
            text-shadow: 0 0 80px currentColor; opacity: 0.97; pointer-events: none; transition: all 0.08s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="bottom-controls">
        <div class="slider-group">
            <label>π Count: <span id="digit-count-val">50K</span></label>
            <input type="range" id="digit-count" min="1000" max="1000000" step="1000" value="50000">
        </div>
        <div class="slider-group">
            <label>Speed: <span id="speed-val">0.2</span>ms</label>
            <input type="range" id="speed" min="-1.5" max="2.5" step="0.05" value="-0.7">
        </div>
        <button id="fetch-btn">🚀 Load 1M π</button>
        <button id="load-more-btn">+50K</button>
        <div id="status">Ready - logarithmic hyperspeed animation</div>
    </div>
    <canvas id="chart-canvas"></canvas>
    <div id="current-digit">π</div>

    <script>
        const canvas = document.getElementById('chart-canvas');
        const ctx = canvas.getContext('2d');
        const countSlider = document.getElementById('digit-count');
        const speedSlider = document.getElementById('speed');
        const fetchBtn = document.getElementById('fetch-btn');
        const moreBtn = document.getElementById('load-more-btn');
        const status = document.getElementById('status');
        const countVal = document.getElementById('digit-count-val');
        const speedVal = document.getElementById('speed-val');
        const digitEl = document.getElementById('current-digit');

        let f = new Array(10).fill(0);
        let p = 0;
        let d = '';
        let raf = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Log speed (negative = sub-ms ultra)
        function spd() {
            return Math.max(0.05, Math.pow(10, parseFloat(speedSlider.value)));
        }

        countSlider.oninput = () => countVal.textContent = parseInt(countSlider.value).toLocaleString();
        speedSlider.oninput = () => speedVal.textContent = spd().toFixed(1);

        async function π(n) {
            try {
                const r = await fetch(`https://api.pi.delivery/api/v1/pi?decimal_places=${n}`);
                const data = await r.json();
                return data.pi.replace(/[^0-9]/g, '').slice(1);
            } catch {
                const s = '14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196442881097566593344612847564823378678316527120190914564856692346034861045432664821339360726024914127372458700660631558817488152092096282925409171536436789259036001133053054882046652138414695194151160943305727036575959195309218611738193261179310511854807446237';
                return s.repeat(Math.ceil(n / s.length)).slice(0, n);
            }
        }

        function tick() {
            if (p >= d.length) {
                cancelAnimationFrame(raf);
                status.textContent = `Complete! ${p.toLocaleString()} π digits`;
                return;
            }
            const c = d[p];
            f[parseInt(c)]++;
            p++;
            digitEl.textContent = c;
            digitEl.style.color = `hsl(${parseInt(c)*36}, 95%, 65%)`;
        }

        function paint() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            
            const bw = Math.floor((w - 80) / 10);
            const ch = h * 0.78;
            const mb = 115;
            const mf = Math.max(...f, 1);

            // Smooth gradient BG
            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#000');
            g.addColorStop(0.6, '#0a0a0a');
            g.addColorStop(1, '#1a1a1a');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);

            // Grid lines
            ctx.strokeStyle = 'rgba(64,128,255,0.15)';
            ctx.lineWidth = 1.2;
            for (let i = 0; i <= 10; i += 2) {
                const y = h - mb - (i/10) * ch;
                ctx.lineDashOffset = p * 0.1;
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(w - 40, y);
                ctx.stroke();
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Bars with advanced glow
            for (let i = 0; i < 10; i++) {
                const bh = f[i] / mf * ch;
                const x = 45 + i * bw;

                // Multi-layer glow
                ctx.shadowColor = `hsl(${i*36}, 95%, 60%)`;
                ctx.shadowBlur = 25;
                ctx.fillStyle = `hsla(${i*36}, 95%, 60%, 0.8)`;
                ctx.fillRect(x-1, h - mb - bh -1, bw+2, bh+2);
                ctx.shadowBlur = 12;
                ctx.fillStyle = `hsla(${i*36}, 95%, 65%, 1)`;
                ctx.fillRect(x, h - mb - bh, bw-2, bh);
                ctx.shadowBlur = 0;

                // Digit label HIGH above (safe position)
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.font = `bold ${Math.min(30, w/40)}px system-ui`;
                ctx.fillText(i, x + bw/2, h - mb - bh - 35); // Higher up
                ctx.shadowBlur = 0;

                // Count center
                ctx.font = `bold ${Math.min(22, w/55)}px monospace`;
                ctx.fillStyle = '#f0f0f0';
                ctx.fillText(f[i].toLocaleString(), x + bw/2, h - mb - bh/2 + 2);

                if (p > 100) {
                    ctx.font = `${Math.min(15, w/85)}px monospace`;
                    ctx.fillStyle = '#888';
                    ctx.fillText(((f[i]/p)*100).toFixed(1)+'%', x + bw/2, h - mb + 8);
                }
            }

            // Dynamic title
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#10b981';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = `bold ${Math.min(52, w/20)}px system-ui`;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`π | ${p.toLocaleString()} digits`, 30, 40);
            ctx.shadowBlur = 0;
        }

        let fpsCounter = 0;
        function loop() {
            fpsCounter++;
            if (fpsCounter % Math.max(1, Math.floor(spd())) === 0) tick();
            paint();
            raf = requestAnimationFrame(loop);
        }

        fetchBtn.onclick = async () => {
            status.textContent = 'Loading π digits...';
            d = await π(parseInt(countSlider.value));
            f.fill(0);
            p = 0;
            cancelAnimationFrame(raf);
            status.textContent = `⚡ Loaded ${d.length.toLocaleString()} - maximum speed`;
            requestAnimationFrame(loop);
        };

        moreBtn.onclick = async () => {
            status.textContent = 'Streaming more π...';
            d += await π(50000);
            status.textContent = `+50K | ${d.length.toLocaleString()} total`;
        };

        paint();
    </script>
</body>
</html>
