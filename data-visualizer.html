<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Digits Frequency Visualizer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
        }
        label { display: block; margin: 10px 0 5px; }
        input[type="range"] { width: 200px; }
        button { margin: 5px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #stats {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            min-width: 250px;
            max-height: 200px;
            overflow-y: auto;
        }
#current-digit {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 120px;
            font-weight: bold;
            color: hsl(0, 70%, 60%);
            text-shadow: 0 0 30px currentColor;
            opacity: 0.9;
            pointer-events: none;
            transition: all 0.2s ease;
        }


        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>Digits to fetch: <span id="digit-count-val">10000</span></label>
        <input type="range" id="digit-count" min="100" max="1000000" step="1000" value="10000">
        <br>
        <label>Animation speed: <span id="speed-val">20</span>ms</label>
        <input type="range" id="speed" min="1" max="200" step="1" value="20">
        <br>
<button id="fetch-btn">Fetch Pi Digits & Animate</button>
        <br>
        <button id="load-more-btn" style="background: #28a745; margin-top: 5px; padding: 10px;">Load More (+5000 digits)</button>
        <div id="status">Ready</div>
    </div>
    <div id="stats">
        <div>Total digits: <span id="total-digits">0</span></div>
        <div id="freq-list"></div>
    </div>
    <canvas id="chart-canvas"></canvas>
    <div id="current-digit">?</div>

    <script>
        const canvas = document.getElementById('chart-canvas');
        const ctx = canvas.getContext('2d');
        const digitCountSlider = document.getElementById('digit-count');
        const speedSlider = document.getElementById('speed');
        const fetchBtn = document.getElementById('fetch-btn');
        const status = document.getElementById('status');
        const totalDigitsSpan = document.getElementById('total-digits');
        const freqList = document.getElementById('freq-list');
        const digitsPreview = document.getElementById('digits-preview');
        const digitCountVal = document.getElementById('digit-count-val');
        const speedVal = document.getElementById('speed-val');
        const loadMoreBtn = document.getElementById('load-more-btn');

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 200; // Avoid preview/controls overlap
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let frequencies = new Array(10).fill(0);
        let totalDigits = 0;
        let allDigits = '';
        let animationInterval;

        // Update sliders display
        digitCountSlider.addEventListener('input', () => digitCountVal.textContent = digitCountSlider.value);
        speedSlider.addEventListener('input', () => speedVal.textContent = speedSlider.value + 'ms');

        // Fetch Pi digits from API
        async function fetchPiDigits(numDigits) {
            status.textContent = 'Fetching...';
            try {
                let response;
if (numDigits <= 5000000) { // Increased for more digits
                    response = await fetch(`https://api.pi.delivery/api/v1/pi?decimal_places=${numDigits}`);
                    const data = await response.json();
                    return data.pi.replace(/[^0-9]/g, '').slice(0, numDigits); // Digits after decimal
                } else {
                    throw new Error('Max 1M digits');
                }
            } catch (error) {
                status.textContent = 'Fetch error (CORS?), using sample digits: ' + error.message;
                // Fallback sample first 1000 digits of Pi (after decimal)
return '1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491273811200048543614869752870696931095905516597937791620845269840161937401508404559689907103847549478230703856870410532062954608557992605604742665208902869129393870477147137165253976398477795786243848392057475916669047397215588';
            }
        }

        // Update frequencies from new digit
        function addDigit(digitChar) {
            const digit = parseInt(digitChar);
            frequencies[digit]++;
            totalDigits++;
        }
        // Render frequency bar chart - clearer vertical bars with labels
        function renderChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = canvas.width / 12;
            const chartHeight = canvas.height * 0.85;
            const marginBottom = 60;
            const maxFreq = Math.max(...frequencies, 1);
            const barSpacing = barWidth * 0.2;

            // Background
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const y = canvas.height - marginBottom - (i / 10) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Bars
            ctx.textAlign = 'center';
            for (let i = 0; i < 10; i++) {
                const barHeight = (frequencies[i] / maxFreq) * chartHeight;
                const x = (canvas.width - 10 * barWidth) / 2 + i * barWidth;

                // Bar shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(x + 1, canvas.height - marginBottom - barHeight + 1, barWidth - 4, barHeight);

                // Bar
                ctx.fillStyle = `hsl(${i * 36}, 70%, 60%)`;
                ctx.fillRect(x, canvas.height - marginBottom - barHeight, barWidth - 4, barHeight);

                // Digit label
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px Arial';
                ctx.fillText(i.toString(), x + barWidth / 2, canvas.height - 20);

                // Count label
                ctx.font = 'bold 20px Arial';
                ctx.fillText(frequencies[i].toString(), x + barWidth / 2, canvas.height - marginBottom - barHeight - 5);

                // % label
                if (totalDigits > 0) {
                    const percent = ((frequencies[i] / totalDigits) * 100).toFixed(1);
                    ctx.font = '16px Arial';
                    ctx.fillText(percent + '%', x + barWidth / 2, canvas.height - marginBottom - barHeight - 25);
                }
            }

            // Title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Pi Digits Frequency (0-9)', 20, 40);
        }



        // Update stats and preview
        function updateStats() {
            totalDigitsSpan.textContent = totalDigits.toLocaleString();

            freqList.innerHTML = frequencies.map((f, i) => `<div>${i}: ${f} (${((f/totalDigits)*100).toFixed(1)}%)</div>`).join('');
        }

        // Animate: add one digit at a time
        function animateDigits() {
            if (allDigits.length === 0) return;

            const idx = totalDigits;
            if (idx < allDigits.length) {
                const digitChar = allDigits[idx];
                const digit = parseInt(digitChar);
                addDigit(digitChar);
                document.getElementById('current-digit').textContent = digitChar;
                document.getElementById('current-digit').style.color = `hsl(${digit * 36}, 70%, 60%)`;
                renderChart();
                updateStats();
                status.textContent = `Processed ${totalDigits}/${allDigits.length}`;
            } else {
                clearInterval(animationInterval);
                status.textContent = 'Complete!';
            }
        }

        // Main fetch and animate
        fetchBtn.addEventListener('click', async () => {
            const numDigits = parseInt(digitCountSlider.value);
            const digits = await fetchPiDigits(numDigits);
            if (digits) {
                allDigits = digits;
                frequencies = new Array(10).fill(0);
                totalDigits = 0;
                renderChart();
                updateStats();
                status.textContent = 'Starting animation...';
                clearInterval(animationInterval);
                animationInterval = setInterval(animateDigits, parseInt(speedSlider.value));
            }
        });

        // Load more digits - append for infinite streaming
        loadMoreBtn.addEventListener('click', async () => {
            const chunkSize = 5000;
            status.textContent = 'Appending more digits...';
            const digits = await fetchPiDigits(chunkSize);
            if (digits && digits.length > 0) {
                allDigits += digits;
                status.textContent = `Appended ${digits.length} digits. Total available: ${allDigits.length}, processed: ${totalDigits}`;
                if (!animationInterval) {
                    animationInterval = setInterval(animateDigits, parseInt(speedSlider.value));
                }
                document.getElementById('load-more-btn').style.background = '#28a745';
            }
        });

        // Initial render
        renderChart();
    </script>
</body>
</html>
